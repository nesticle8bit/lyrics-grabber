<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyrics Grabber</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="light">
  <div id="app">
<header class="header">
      <div class="header-left">
        <img src="icon.png" class="header-icon" alt="" />
        <span class="header-title">Lyrics Grabber</span>
        <button class="btn-icon" id="btn-folders" title="Folders">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        </button>
      </div>
      <div class="header-actions">
        <button class="btn btn-primary btn-sm" id="btn-add-folder">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add
        </button>
        <button class="btn btn-success btn-sm" id="btn-start">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21"/></svg>
          Start
        </button>
        <button class="btn btn-warning btn-sm" id="btn-pause" style="display:none">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          Pause
        </button>
        <button class="btn-icon" id="btn-rescan" title="Re-scan folders">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </button>
        <div class="header-divider"></div>
        <button class="btn-icon" id="btn-retry" title="Retry failed">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </button>
        <button class="btn-icon" id="btn-clear" title="Clear completed">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
      <div class="header-right">
        <button class="btn-icon" id="btn-theme" title="Toggle Theme">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </header>
<div class="stats-row">
      <div class="stats-pills">
        <div class="stat-pill"><span class="stat-label">Total</span><span class="stat-value" id="val-total">0</span></div>
        <div class="stat-pill pending"><span class="stat-label">Pend</span><span class="stat-value" id="val-pending">0</span></div>
        <div class="stat-pill processing"><span class="stat-label">Proc</span><span class="stat-value" id="val-processing">0</span></div>
        <div class="stat-pill completed"><span class="stat-label">Done</span><span class="stat-value" id="val-completed">0</span></div>
        <div class="stat-pill failed"><span class="stat-label">Fail</span><span class="stat-value" id="val-failed">0</span></div>
        <div class="stat-pill skipped"><span class="stat-label">Skip</span><span class="stat-value" id="val-skipped">0</span></div>
      </div>
      <div class="progress-compact">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <span class="progress-label" id="progress-text">0%</span>
        <span class="progress-eta" id="progress-eta"></span>
      </div>
    </div>
<div class="filter-row">
      <div class="search-wrapper">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" placeholder="Search... (Ctrl+F)" class="search-input">
      </div>
      <div class="filter-chips">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="pending">Pending</button>
        <button class="chip" data-filter="processing">Active</button>
        <button class="chip" data-filter="completed">Done</button>
        <button class="chip" data-filter="failed">Failed</button>
        <button class="chip" data-filter="skipped">Skipped</button>
      </div>
    </div>
<div class="song-list" id="song-list">
      <div class="empty-state" id="empty-state">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <h3>No songs yet</h3>
        <p>Add a music folder or drag & drop to start</p>
      </div>
    </div>
<div class="drop-overlay" id="drop-overlay">
      <div class="drop-content">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
        <h3>Drop folders here</h3>
        <p>Recursive scan for music files</p>
      </div>
    </div>

    <div class="scan-overlay" id="scan-overlay" style="display:none">
      <div class="scan-card">
        <div class="scan-spinner"></div>
        <div class="scan-title">Scanning...</div>
        <div class="scan-detail" id="scan-detail">Preparing...</div>
        <div class="scan-count" id="scan-count">0 files found</div>
      </div>
    </div>
<div class="panel-overlay" id="folders-panel" style="display:none">
      <div class="panel-backdrop" id="panel-backdrop"></div>
      <div class="panel-content">
        <div class="panel-header">
          <h3>Folders</h3>
          <button class="btn-close" id="btn-close-folders">&times;</button>
        </div>
        <div class="panel-body" id="folders-list"></div>
        <div class="panel-footer">
          <button class="btn btn-primary btn-full" id="btn-add-folder-panel">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add Folder
          </button>
        </div>
      </div>
    </div>
<div class="modal-overlay" id="lyrics-modal" style="display:none">
      <div class="modal-backdrop" id="modal-backdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title-group">
            <h3 id="modal-title">Song Title</h3>
            <span id="modal-artist" class="modal-subtitle">Artist</span>
          </div>
          <button class="btn-close" id="btn-close-modal">&times;</button>
        </div>
        <textarea class="lyrics-editor" id="lyrics-editor" placeholder="No lyrics available..."></textarea>
        <div class="modal-footer">
          <button class="btn btn-ghost" id="btn-cancel-lyrics">Cancel</button>
          <button class="btn btn-primary" id="btn-save-lyrics">Save Lyrics</button>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
